name: baloga_ar_rescue
description: "Penjaga Ekosistem Baloga: AR Rescue Flutter Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  flame: ^1.22.0
  flutter_riverpod: ^2.6.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.0.0
  permission_handler: ^11.0.0
  camera: ^0.11.0
  cached_network_image: ^3.4.0
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/Bayam Duri.jpg
    - assets/daun mangga.jpg
    - assets/Honda PCX 160.jpg
    - assets/kopdes.jpg
    - assets/Kudzu.jpg
    - assets/Lidah Mertua.jpg
    - assets/Pohon Pisang.jpg
    - assets/Rumput Ekor Kucing.jpg
    - assets/Saga Rambat.jpg
    - assets/Sandal Selop Karet Pria.jpg
